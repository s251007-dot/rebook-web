<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>rebloom</title>

<style>
body{
 text-align:center;
 font-family:sans-serif;
}

video{
 width:90%;
 border-radius:20px;
}

#result{
 font-size:25px;
 margin-top:20px;
 white-space:pre-line;
}

button{
 font-size:20px;
 margin:10px;
 padding:10px;
}
</style>

</head>

<body>

<h1>🌱 rebloom</h1>

<video id="video" autoplay playsinline></video>

<div id="result">
商品をカメラに映してください
</div>

<button onclick="showLip()">
💄 rebloom Lip
</button>

<button onclick="showCheek()">
🌸 rebloom Cheek
</button>


<script>

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({
 video:{
  facingMode:"environment"
 }
})
.then(stream=>{
 video.srcObject = stream;
})
.catch(err=>{
 alert(err);
});


function showLip(){
 document.getElementById("result").innerText =
 "rebloom Lip\n\n全成分\n水\nグリセリン\nBG\nシア脂";
}


function showCheek(){
 document.getElementById("result").innerText =
 "rebloom Cheek\n\n全成分\nメントキシン\n果実エキス\n赤色顔料";
}

</script>

</body>
</html>
